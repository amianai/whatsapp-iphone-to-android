[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-iphone-to-android"
version = "1.1.0"
description = "Move WhatsApp from an iPhone to Android without a bridge phone: rebuild a restorable Android backup from a local iPhone backup."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Elias Portugal", email = "portugal402@gmail.com" },
    { name = "amianai" },
]
keywords = [
    "whatsapp",
    "backup",
    "migration",
    "merge",
    "fuse",
    "ios-to-android",
    "crypt15",
    "crypt14",
    "sqlite",
    "android"
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "rich>=15.0.0",
    "wa-crypt-tools>=0.1.0",
    "iphone-backup-decrypt>=0.11.2",
]

[project.optional-dependencies]
stickers = ["pillow>=11"]

[project.scripts]
wa-fuse = "wa_fuse.cli:main"
wa-wizard = "wa_fuse.tui:start_wizard"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["wa_fuse"]
